name: Deploy to Azure App Service

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout Repository
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Azure Login using OIDC
      # =====================================================
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # =====================================================
      # 3. Verify Azure Authentication
      # =====================================================
      - name: Verify Azure Authentication
        shell: bash
        run: |
          echo "========================================"
          echo "Azure Authentication"
          echo "========================================"

          az account show

          echo "========================================"
          echo "Azure Subscription"
          echo "========================================"

          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

      # =====================================================
      # 4. Verify Resource Group
      # =====================================================
      - name: Verify Resource Group
        shell: bash
        run: |
          echo "Checking Resource Group..."

          az group show \
            --name "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --output table

      # =====================================================
      # 5. Verify Azure App Service
      # =====================================================
      - name: Verify Azure App Service
        shell: bash
        run: |
          echo "Checking Azure App Service..."

          az webapp show \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --output table

      # =====================================================
      # 6. Deploy Application
      # =====================================================
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}
          package: .

      # =====================================================
      # 7. Verify Deployment
      # =====================================================
      - name: Verify Deployment
        shell: bash
        run: |
          echo "========================================"
          echo "Deployment completed"
          echo "========================================"

          az webapp show \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query "{Name:name, State:state, Hostname:defaultHostName}" \
            --output table

      # =====================================================
      # 8. Azure Logout
      # =====================================================
      - name: Azure Logout
        if: always()
        run: |
          az logout
